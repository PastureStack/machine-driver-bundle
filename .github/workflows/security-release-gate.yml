name: Security release gate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  gate:
    name: Verify, test, reproduce, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_DATE_EPOCH: "0"
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          check-latest: false
          cache: false

      - name: Install the exact Python toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.9'
          check-latest: false

      - name: Resolve and qualify the OpenTelemetry dependency update
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local
          mkdir -p evidence
          ./scripts/prepare-sources "$RUNNER_TEMP/machine-sources"
          (
            cd "$RUNNER_TEMP/machine-sources/source"
            go get go.opentelemetry.io/otel@v1.47.0 \
              go.opentelemetry.io/otel/metric@v1.47.0 \
              go.opentelemetry.io/otel/trace@v1.47.0 \
              go.opentelemetry.io/otel/sdk@v1.47.0 \
              go.opentelemetry.io/otel/sdk/metric@v1.47.0
            go mod tidy
            go list -m all | grep '^go.opentelemetry.io/' | tee "$GITHUB_WORKSPACE/evidence/otel-modules.txt"
          )
          cp "$RUNNER_TEMP/machine-sources/source/"go.{mod,sum} evidence/
          if ./scripts/build-binaries "$RUNNER_TEMP/machine-sources" "$RUNNER_TEMP/machine-binaries"; then
            echo 'Expected the old binary locks to reject this qualification build.'
            exit 1
          fi
          test -f evidence/hash-qualification/SHA256SUMS
          (cd evidence/hash-qualification && sha256sum -c SHA256SUMS)
          go version -m evidence/hash-qualification/docker-machine | tee evidence/docker-machine-build-info.txt
          go version -m evidence/hash-qualification/docker-machine-driver-packet | tee evidence/packet-build-info.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machine-driver-bundle-otel147-qualification
          path: evidence/
          if-no-files-found: error
          retention-days: 7
